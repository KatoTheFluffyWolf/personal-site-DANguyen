<!doctype html>

      <section class="side-section" aria-labelledby="contact-heading">

        <div class="section-content">
          <p id="talk-description"></p>
          <div id="talk-action" class="actions talk-actions"></div>
          <p id="talk-note" class="talk-note"></p>

      </section>
      <section class="section" aria-labelledby="pub-heading">
        <div class="section-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6zM15 3v5h4M9 12h7M9 16h7"/></svg></div>
